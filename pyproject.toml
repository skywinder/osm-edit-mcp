[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "osm-edit-mcp"
version = "0.2.1"
description = "Review-first MCP server for previewed, version-checked OpenStreetMap road edits from local GPX surveys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "skywinder"}
]
keywords = [
    "openstreetmap",
    "osm",
    "mcp",
    "model-context-protocol",
    "gis",
    "geospatial",
    "gpx",
    "map-editing",
    "fastmcp",
    "ai",
    "assistant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: GIS",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29.1,<2",
    "typing-extensions>=4.12,<5",
    "opening-hours-py>=2.1.4,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.11.0,<3",
    "pydantic-settings>=2.10.0,<3",
    "python-dotenv>=1.2.3,<2",
    "authlib>=1.8.0,<2",
    "cryptography>=50.0.1,<51",
    "keyring>=25.7.0,<26",
    "anyio>=4.9.0,<5",
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.141.1,<1",
    "python-multipart>=0.0.32,<1",
    "uvicorn[standard]>=0.52.4,<1",
]

[project.urls]
Homepage = "https://github.com/skywinder/osm-edit-mcp"
Repository = "https://github.com/skywinder/osm-edit-mcp"
Issues = "https://github.com/skywinder/osm-edit-mcp/issues"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "hatchling>=1.27,<2",
    "pip-audit>=2.9.0",
    "pre-commit>=3.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "twine>=6.0.0",
    "types-defusedxml>=0.7.0.20260504",
]

[project.scripts]
osm-edit-mcp = "osm_edit_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osm_edit_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/oauth_auth.py",
    "/lhm.plugin.json",
    "/pyproject.toml",
    "/scripts/security_audit.py",
    "/src",
    "/tests",
    "/web_server.py",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage flags are passed explicitly by CI rather than baked in here, so that
# a bare `pytest` works without pytest-cov installed.
addopts = []
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/osm_edit_mcp"]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
